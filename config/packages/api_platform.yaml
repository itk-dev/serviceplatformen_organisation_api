api_platform:
    title: Hello API Platform
    version: 1.0.0
    # Use the controller plus provider/processor request flow, which is the API Platform 4 default.
    use_symfony_listeners: false
    formats:
        jsonld: ['application/ld+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    serializer:
        # Keep the "hydra:" prefix on collection keys; API Platform 4 drops it by default.
        hydra_prefix: true
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
